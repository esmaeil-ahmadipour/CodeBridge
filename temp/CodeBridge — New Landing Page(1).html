<body>
  <div id="__bundler_placeholder">Loading CodeBridge | ارسال سورس کد به هوش مصنوعی با کمترین توکن، حتی از گوشی...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();

2Fa><a href=\"#features\">امکانات<\u002Fa><a href=\"#trust\">حریم خصوصی<\u002Fa><a href=\"#web\">ابزار وب<\u002Fa><\u002Fdiv>\n<a class=\"btn bp\" href=\"#dl\" style=\"min-height:44px\">دانلود<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:48px;align-items:center;padding:72px 0 80px\">\n<div>\n<div style=\"display:inline-block;padding:4px 14px;border-radius:99px;background:#12302D;color:#5EEAD4;font-size:14px;font-weight:600;border:1px solid #1D5A53\">ابزار برنامه‌نویسانِ همراه با هوش مصنوعی<\u002Fdiv>\n<h1 style=\"margin:20px 0 16px;font-size:clamp(34px,5vw,56px);line-height:1.3;font-weight:800\">کدت را تمیز به AI بده،<br><span style=\"color:{{accent}}\">تغییرات را بدون کپی‌پیست برگردان.<\u002Fspan><\u002Fh1>\n<p style=\"margin:0 0 28px;font-size:19px;color:#A3AFBF;max-width:520px\">CodeBridge پروژه‌ات را امن و بدون فایل‌های اضافه به متن تبدیل می‌کند تا توکن هدر نرود، و diff جواب هوش مصنوعی را خودش روی پروژه اعمال می‌کند. دیگر لازم نیست فایل باز کنی، دنبال خط بگردی و یکی‌یکی کپی کنی.<\u002Fp>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\"><a class=\"btn bp\" href=\"#dl\">دانلود اپ دسکتاپ<\u002Fa><a class=\"btn bs\" href=\"#mobile\">امتحان در مرورگر گوشی یا دسکتاپ<\u002Fa><\u002Fdiv>\n<div style=\"display:flex;gap:20px;margin-top:28px;font-size:14px;color:#A3AFBF;flex-wrap:wrap\"><span>کد آپلود نمی‌شود<\u002Fspan><span>اندروید، iOS و دسکتاپ<\u002Fspan><span>Undo دقیق<\u002Fspan><span>رایگان و متن‌باز<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#151C25;border:1px solid #2A384A;border-radius:20px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.45)\">\n<div style=\"display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #2A384A;font-size:13px;color:#A3AFBF\">جواب AI (diff) را کپی کن، Enter بزن<\u002Fdiv>\n<div class=\"mono\" style=\"font-size:13px;line-height:1.8;padding:16px\">\n<div style=\"color:#A3AFBF\">--- a/src/auth.py<\u002Fdiv>\n<div style=\"color:#A3AFBF\">+++ b/src/auth.py<\u002Fdiv>\n<div style=\"color:#FCA5A5;background:#2A1518;padding:0 8px;border-radius:4px\">- if token == None:<\u002Fdiv>\n<div style=\"color:#86EFAC;background:#12261B;padding:0 8px;border-radius:4px\">+ if not token:<\u002Fdiv>\n<div style=\"color:#86EFAC;background:#12261B;padding:0 8px;border-radius:4px\">+     raise AuthError(\"missing token\")<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 10px 10px;background:#12302D;border-radius:12px;padding:12px 16px\">\n<span style=\"color:#5EEAD4;font-weight:600\">اعمال شد: ۳ فایل، بدون باز کردن پوشه<\u002Fspan>\n<span style=\"font-size:14px;color:#A3AFBF;border:1px solid #1D5A53;border-radius:8px;padding:0 12px\">Undo<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"features\" style=\"padding:16px 0 72px\">\n<h2 style=\"font-size:32px;margin:0 0 24px;font-weight:800\">چرا کپی دستیِ کد، وقت و توکنت را می‌سوزاند؟<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n<div class=\"card\"><div style=\"color:#FCA5A5;font-weight:800;margin-bottom:12px\">بدون CodeBridge<\u002Fdiv><div style=\"color:#A3AFBF\">AI می‌گوید «خط ۴۲ را عوض کن»<br>پوشه را باز می‌کنی و فایل را پیدا می‌کنی<br>خط را پیدا و دستی کپی می‌کنی، این بار برای ۱۰ فایل<br>برای ارسال پروژه هم node_modules، فایل‌های lock و SVG را دستی کنار می‌گذاری، وگرنه توکن‌هایت هدر می‌رود<\u002Fdiv><\u002Fdiv>\n<div class=\"card\" style=\"border-color:{{accent}};background:#12211F\"><div style=\"color:{{accent}};font-weight:800;margin-bottom:12px\">با CodeBridge<\u002Fdiv><div>پروژه با یک کلیک و بدون فایل اضافه به متن تبدیل می‌شود<br>از AI فقط diff می‌خواهی<br>diff را می‌دهی و CodeBridge خودش روی پروژه اعمال می‌کند<br>اشتباه بود؟ با یک Undo همه‌چیز برمی‌گردد<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div id=\"mobile\" class=\"card\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;align-items:center;padding:40px;margin-bottom:72px;background:#12211F;border-color:#1D5A53\">\n<div>\n<div style=\"display:inline-block;padding:4px 14px;border-radius:99px;background:#12302D;color:#5EEAD4;font-size:14px;font-weight:600;border:1px solid #1D5A53\">اندروید و iOS<\u002Fdiv>\n<h2 style=\"font-size:32px;line-height:1.5;margin:16px 0 12px;font-weight:800\">سورس پروژه را از گوشی هم برای AI بفرست<\u002Fh2>\n<p style=\"margin:0 0 20px;color:#A3AFBF;font-size:17px\">ZIP پروژه را در مرورگر گوشی انتخاب کن و متنِ آماده‌ی ارسال به هوش مصنوعی را بگیر. بدون نصب، بدون آپلود و بدون اینکه خودت دنبال فایل‌ها بگردی. هرچه کمتر به AI برسد، توکن کمتری مصرف می‌شود.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px;font-size:16px\">\n<div style=\"display:flex;gap:10px;align-items:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2DD4BF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg>فایل‌های بی‌مصرف و وابستگی‌ها خودکار کنار می‌روند<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2DD4BF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg>کلیدها و رمزها پیش از ارسال پوشانده می‌شوند<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2DD4BF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg>بدون تنظیم امنیتی و بدون جست‌وجوی دستی فایل<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:24px;display:flex;gap:12px;flex-wrap:wrap\">\n<a class=\"btn bp\" href=\"#web\" style=\"gap:10px;min-height:52px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 17a7 7 0 0 1 14 0z\"><\u002Fpath><path d=\"M8 6l1.5 2.5M16 6l-1.5 2.5\"><\u002Fpath><circle cx=\"9.5\" cy=\"13\" r=\".6\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"14.5\" cy=\"13\" r=\".6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>شروع از گوشی اندروید<\u002Fa>\n<a class=\"btn bp\" href=\"#web\" style=\"gap:10px;min-height:52px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"3\"><\u002Frect><path d=\"M10 5.5h4M11 19h2\"><\u002Fpath><\u002Fsvg>شروع از آیفون (iOS)<\u002Fa>\n<\u002Fdiv>\n<div style=\"margin-top:12px;font-size:14px;color:#A3AFBF\">بدون نصب؛ مستقیم در مرورگر گوشی<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"justify-self:center;width:264px;max-width:100%;box-sizing:border-box;background:#0C1117;border:2px solid #3A4A5E;border-radius:32px;padding:20px 16px;display:flex;flex-direction:column;gap:10px;font-size:13px\">\n<div style=\"color:#A3AFBF;text-align:center;margin-bottom:4px\">پروژه‌ی شما<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#151C25\"><span class=\"mono\">node_modules/<\u002Fspan><span style=\"color:#FCA5A5\">حذف شد<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#151C25\"><span class=\"mono\">package-lock.json<\u002Fspan><span style=\"color:#FCA5A5\">حذف شد<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#151C25\"><span class=\"mono\">.env<\u002Fspan><span style=\"color:#FCD34D\">پوشانده شد<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#151C25\"><span class=\"mono\">src/<\u002Fspan><span style=\"color:#86EFAC\">ارسال می‌شود<\u002Fspan><\u002Fdiv>\n<div style=\"text-align:center;padding:12px;border-radius:12px;background:#2DD4BF;color:#06201D;font-weight:600;margin-top:4px\">آماده‌ی ارسال به AI<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"how\" style=\"padding:0 0 72px\">\n<h2 style=\"font-size:32px;margin:0 0 24px;font-weight:800\">در سه قدم، بدون درگیری<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n<div class=\"card\"><div style=\"font-size:44px;font-weight:800;color:{{accent}};line-height:1.2\">۱<\u002Fdiv><h3 style=\"margin:8px 0\">خروجی بگیر<\u002Fh3><div style=\"color:#A3AFBF\">ignoreها، وابستگی‌ها، SVG، فایل‌های lock و تست‌ها خودکار کنار می‌روند؛ فقط چیزی که AI لازم دارد باقی می‌ماند.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><div style=\"font-size:44px;font-weight:800;color:{{accent}};line-height:1.2\">۲<\u002Fdiv><h3 style=\"margin:8px 0\">diff بخواه<\u002Fh3><div style=\"color:#A3AFBF\">متن را به AI بده و بخواه فقط تغییرات را به‌صورت diff برگرداند.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><div style=\"font-size:44px;font-weight:800;color:{{accent}};line-height:1.2\">۳<\u002Fdiv><h3 style=\"margin:8px 0\">اعمال کن<\u002Fh3><div style=\"color:#A3AFBF\">diff را کپی کن و Enter بزن. تغییرات روی پروژه اعمال می‌شود، همراه با snapshot و Undo دقیق.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div id=\"trust\" style=\"padding:0 0 72px\">\n<h2 style=\"font-size:32px;margin:0 0 24px;font-weight:800\">چرا می‌توان به CodeBridge اعتماد کرد؟<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n<div class=\"card\"><strong>اعمال امن<\u002Fstrong><div style=\"color:#A3AFBF;font-size:15px;margin-top:6px\">اعمال تغییرات اتمیک است و فقط فایل‌های همان پچ را لمس می‌کند.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><strong>Undo دقیق<\u002Fstrong><div style=\"color:#A3AFBF;font-size:15px;margin-top:6px\">از هر اجرا snapshot گرفته می‌شود و برگشت کامل است.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><strong>حذف اسرار<\u002Fstrong><div style=\"color:#A3AFBF;font-size:15px;margin-top:6px\">کلیدها و رمزها پیش از ارسال به AI پوشانده می‌شوند.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><strong>کاملاً محلی<\u002Fstrong><div style=\"color:#A3AFBF;font-size:15px;margin-top:6px\">چیزی آپلود نمی‌شود و آفلاین هم کار می‌کند.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div id=\"web\" class=\"card\" style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:24px;padding:28px 32px;margin-bottom:72px\">\n<div style=\"max-width:640px\"><h3 style=\"margin:0 0 6px;font-size:22px\">فقط خروجی می‌خواهی؟ همین‌جا، در مرورگر<\u002Fh3><div style=\"color:#A3AFBF\">ZIP را بینداز و متن آماده بگیر؛ بدون نصب و بدون آپلود، روی گوشی و دسکتاپ. اعمال diff و Undo در اپ دسکتاپ انجام می‌شود.<\u002Fdiv><\u002Fdiv>\n<a class=\"btn bs\" href=\"#web\" style=\"white-space:nowrap\">انتخاب ZIP<\u002Fa>\n<\u002Fdiv>\n\n<div id=\"dl\" style=\"text-align:center;background:linear-gradient(135deg,#0F766E,#115E59);border-radius:24px;padding:56px 32px;margin-bottom:56px\">\n<h2 style=\"margin:0 0 10px;font-size:34px;font-weight:800;color:#fff\">زمانت را صرف تصمیم‌های ارزشمند کن، نه زیر و رو کردن فایل‌ها<\u002Fh2>\n<p style=\"margin:0 0 24px;font-size:17px;color:#E6FFFA\">کارهای تکراری آماده‌سازی و اعمال کد را به CodeBridge بسپار؛ ذهنت برای معماری، کیفیت و تصمیم‌هایی آزاد می‌ماند که واقعاً به ارزش محصول اضافه می‌کنند.<\u002Fp>\n<div style=\"font-size:15px;color:#CCFBF1;margin-bottom:16px\">سیستم‌عامل خودت را انتخاب کن تا نسخه‌ی مناسب دانلود شود<\u002Fdiv>\n<div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap\">\n<a class=\"btn\" href=\"#dl\" style=\"background:#fff;color:#0B3F3A;min-height:52px;gap:10px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"8.5\" height=\"8.5\" rx=\"1\"><\u002Frect><rect x=\"12.5\" y=\"3\" width=\"8.5\" height=\"8.5\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"12.5\" width=\"8.5\" height=\"8.5\" rx=\"1\"><\u002Frect><rect x=\"12.5\" y=\"12.5\" width=\"8.5\" height=\"8.5\" rx=\"1\"><\u002Frect><\u002Fsvg>دانلود برای ویندوز<\u002Fa>\n<a class=\"btn\" href=\"#dl\" style=\"background:#fff;color:#0B3F3A;min-height:52px;gap:10px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M8 20h8M12 16v4\"><\u002Fpath><\u002Fsvg>دانلود برای مک (macOS)<\u002Fa>\n<a class=\"btn\" href=\"#dl\" style=\"background:#fff;color:#0B3F3A;min-height:52px;gap:10px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M7 10l3 2-3 2M13 15h4\"><\u002Fpath><\u002Fsvg>دانلود برای لینوکس<\u002Fa>\n<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:14px;color:#CCFBF1\">اپ دسکتاپ برای اعمال diff و Undo است. فقط خروجی می‌خواهی؟ <a href=\"#mobile\" style=\"text-decoration:underline;color:#fff\">نسخه‌ی مرورگر را روی گوشی یا دسکتاپ امتحان کن<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 0 40px;text-align:center;color:#A3AFBF;font-size:14px\">CodeBridge · ابزار رایگان و متن‌باز برای کار با هوش مصنوعی<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"width:100%;box-sizing:border-box;background:#0C1117;color:#E9EEF5;font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8\" data-canvas-width=\"1280\" data-canvas-height=\"2350\" data-document-role=\"page\" data-label=\"Landing page (RTL)\">\n<div style=\"max-width:1200px;margin:0 auto;padding:0 32px\">\n\n<div class=\"nav\" style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:20px 0\">\n<strong style=\"font-size:22px;letter-spacing:.5px\">CodeBridge<span style=\"color:#2DD4BF\">.<\u002Fspan><\u002Fstrong>\n<div style=\"display:flex;gap:28px;flex-wrap:wrap;font-size:15px;color:#A3AFBF\"><a href=\"#how\">چطور کار می‌کند<\u002Fa><a href=\"#mobile\">اندروید و iOS<\u002Fa><a href=\"#features\">امکانات<\u002Fa><a href=\"#trust\">حریم خصوصی<\u002Fa><a href=\"#web\">ابزار وب<\u002Fa><\u002Fdiv>\n<a class=\"btn bp\" href=\"#dl\" style=\"min-height:44px\">دانلود<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:48px;align-items:center;padding:72px 0 80px\">\n<div>\n<div style=\"display:inline-block;padding:4px 14px;border-radius:99px;background:#12302D;color:#5EEAD4;font-size:14px;font-weight:600;border:1px solid #1D5A53\">ابزار برنامه‌نویسانِ همراه با هوش مصنوعی<\u002Fdiv>\n<h1 style=\"margin:20px 0 16px;font-size:clamp(34px,5vw,56px);line-height:1.3;font-weight:800\">کدت را تمیز به AI بده،<br><span style=\"color:#2DD4BF\">تغییرات را بدون کپی‌پیست برگردان.<\u002Fspan><\u002Fh1>\n<p style=\"margin:0 0 28px;font-size:19px;color:#A3AFBF;max-width:520px\">CodeBridge پروژه‌ات را امن و بدون فایل‌های اضافه به متن تبدیل می‌کند تا توکن هدر نرود، و diff جواب هوش مصنوعی را خودش روی پروژه اعمال می‌کند. دیگر لازم نیست فایل باز کنی، دنبال خط بگردی و یکی‌یکی کپی کنی.<\u002Fp>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\"><a class=\"btn bp\" href=\"#dl\">دانلود اپ دسکتاپ<\u002Fa><a class=\"btn bs\" href=\"#mobile\">امتحان در مرورگر گوشی یا دسکتاپ<\u002Fa><\u002Fdiv>\n<div style=\"display:flex;gap:20px;margin-top:28px;font-size:14px;color:#A3AFBF;flex-wrap:wrap\"><span>کد آپلود نمی‌شود<\u002Fspan><span>اندروید، iOS و دسکتاپ<\u002Fspan><span>Undo دقیق<\u002Fspan><span>رایگان و متن‌باز<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#151C25;border:1px solid #2A384A;border-radius:20px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.45)\">\n<div style=\"display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #2A384A;font-size:13px;color:#A3AFBF\">جواب AI (diff) را کپی کن، Enter بزن<\u002Fdiv>\n<div class=\"mono\" style=\"font-size:13px;line-height:1.8;padding:16px\">\n<div style=\"color:#A3AFBF\">--- a/src/auth.py<\u002Fdiv>\n<div style=\"color:#A3AFBF\">+++ b/src/auth.py<\u002Fdiv>\n<div style=\"color:#FCA5A5;background:#2A1518;padding:0 8px;border-radius:4px\">- if token == None:<\u002Fdiv>\n<div style=\"color:#86EFAC;background:#12261B;padding:0 8px;border-radius:4px\">+ if not token:<\u002Fdiv>\n<div style=\"color:#86EFAC;background:#12261B;padding:0 8px;border-radius:4px\">+     raise AuthError(\"missing token\")<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 10px 10px;background:#12302D;border-radius:12px;padding:12px 16px\">\n<span style=\"color:#5EEAD4;font-weight:600\">اعمال شد: ۳ فایل، بدون باز کردن پوشه<\u002Fspan>\n<span style=\"font-size:14px;color:#A3AFBF;border:1px solid #1D5A53;border-radius:8px;padding:0 12px\">Undo<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"features\" style=\"padding:16px 0 72px\">\n<h2 style=\"font-size:32px;margin:0 0 24px;font-weight:800\">چرا کپی دستیِ کد، وقت و توکنت را می‌سوزاند؟<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n<div class=\"card\"><div style=\"color:#FCA5A5;font-weight:800;margin-bottom:12px\">بدون CodeBridge<\u002Fdiv><div style=\"color:#A3AFBF\">AI می‌گوید «خط ۴۲ را عوض کن»<br>پوشه را باز می‌کنی و فایل را پیدا می‌کنی<br>خط را پیدا و دستی کپی می‌کنی، این بار برای ۱۰ فایل<br> 9-10\"><\u002Fpath><\u002Fsvg>کلیدها و رمزها پیش از ارسال پوشانده می‌شوند<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2DD4BF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\u002Fpath><\u002Fsvg>بدون تنظیم امنیتی و بدون جست‌وجوی دستی فایل<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:24px;display:flex;gap:12px;flex-wrap:wrap\">\n<a class=\"btn bp\" href=\"#web\" style=\"gap:10px;min-height:52px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 17a7 7 0 0 1 14 0z\"><\u002Fpath><path d=\"M8 6l1.5 2.5M16 6l-1.5 2.5\"><\u002Fpath><circle cx=\"9.5\" cy=\"13\" r=\".6\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"14.5\" cy=\"13\" r=\".6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>شروع از گوشی اندروید<\u002Fa>\n<a class=\"btn bp\" href=\"#web\" style=\"gap:10px;min-height:52px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"3\"><\u002Frect><path d=\"M10 5.5h4M11 19h2\"><\u002Fpath><\u002Fsvg>شروع از آیفون (iOS)<\u002Fa>\n<\u002Fdiv>\n<div style=\"margin-top:12px;font-size:14px;color:#A3AFBF\">بدون نصب؛ مستقیم در مرورگر گوشی<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"justify-self:center;width:264px;max-width:100%;box-sizing:border-box;background:#0C1117;border:2px solid #3A4A5E;border-radius:32px;padding:20px 16px;display:flex;flex-direction:column;gap:10px;font-size:13px\">\n<div style=\"color:#A3AFBF;text-align:center;margin-bottom:4px\">پروژه‌ی شما<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#151C25\"><span class=\"mono\">node_modules/<\u002Fspan><span style=\"color:#FCA5A5\">حذف شد<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#151C25\"><span class=\"mono\">package-lock.json<\u002Fspan><span style=\"color:#FCA5A5\">حذف شد<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#151C25\"><span class=\"mono\">.env<\u002Fspan><span style=\"color:#FCD34D\">پوشانده شد<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#151C25\"><span class=\"mono\">src/<\u002Fspan><span style=\"color:#86EFAC\">ارسال می‌شود<\u002Fspan><\u002Fdiv>\n<div style=\"text-align:center;padding:12px;border-radius:12px;background:#2DD4BF;color:#06201D;font-weight:600;margin-top:4px\">آماده‌ی ارسال به AI<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"how\" style=\"padding:0 0 72px\">\n<h2 style=\"font-size:32px;margin:0 0 24px;font-weight:800\">در سه قدم، بدون درگیری<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n<div class=\"card\"><div style=\"font-size:44px;font-weight:800;color:#2DD4BF;line-height:1.2\">۱<\u002Fdiv><h3 style=\"margin:8px 0\">خروجی بگیر<\u002Fh3><div style=\"color:#A3AFBF\">ignoreها، وابستگی‌ها، SVG، فایل‌های lock و تست‌ها خودکار کنار می‌روند؛ فقط چیزی که AI لازم دارد باقی می‌ماند.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><div style=\"font-size:44px;font-weight:800;color:#2DD4BF;line-height:1.2\">۲<\u002Fdiv><h3 style=\"margin:8px 0\">diff بخواه<\u002Fh3><div style=\"color:#A3AFBF\">متن را به AI بده و بخواه فقط تغییرات را به‌صورت diff برگرداند.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><div style=\"font-size:44px;font-weight:800;color:#2DD4BF;line-height:1.2\">۳<\u002Fdiv><h3 style=\"margin:8px 0\">اعمال کن<\u002Fh3><div style=\"color:#A3AFBF\">diff را کپی کن و Enter بزن. تغییرات روی پروژه اعمال می‌شود، همراه با snapshot و Undo دقیق.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div id=\"trust\" style=\"padding:0 0 72px\">\n<h2 style=\"font-size:32px;margin:0 0 24px;font-weight:800\">چرا می‌توان به CodeBridge اعتماد کرد؟<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n<div class=\"card\"><strong>اعمال امن<\u002Fstrong><div style=\"color:#A3AFBF;font-size:15px;margin-top:6px\">اعمال تغییرات اتمیک است و فقط فایل‌های همان پچ را لمس می‌کند.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><strong>Undo دقیق<\u002Fstrong><div style=\"color:#A3AFBF;font-size:15px;margin-top:6px\">از هر اجرا snapshot گرفته می‌شود و برگشت کامل است.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><strong>حذف اسرار<\u002Fstrong><div style=\"color:#A3AFBF;font-size:15px;margin-top:6px\">کلیدها و رمزها پیش از ارسال به AI پوشانده می‌شوند.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><strong>کاملاً محلی<\u002Fstrong><div style=\"color:#A3AFBF;font-size:15px;margin-top:6px\">چیزی آپلود نمی‌شود و آفلاین هم کار می‌کند.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<div id=\"web\" class=\"card\" style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:24px;padding:28px 32px;margin-bottom:72px\">\n<div style=\"max-width:640px\"><h3 style=\"margin:0 0 6px;font-size:22px\">فقط خروجی می‌خواهی؟ همین‌جا، در مرورگر<\u002Fh3><div style=\"color:#A3AFBF\">ZIP را بینداز و متن آماده بگیر؛ بدون نصب و بدون آپلود، روی گوشی و دسکتاپ. اعمال diff و Undo در اپ دسکتاپ انجام می‌شود.<\u002Fdiv><\u002Fdiv>\n<a class=\"btn bs\" href=\"#web\" style=\"white-space:nowrap\">انتخاب ZIP<\u002Fa>\n<\u002Fdiv>\n\n<div id=\"dl\" style=\"text-align:center;background:linear-gradient(135deg,#0F766E,#115E59);border-radius:24px;padding:56px 32px;margin-bottom:56px\">\n<h2 style=\"margin:0 0 10px;font-size:34px;font-weight:800;color:#fff\">زمانت را صرف تصمیم‌های ارزشمند کن، نه زیر و رو کردن فایل‌ها<\u002Fh2>\n<p style=\"margin:0 0 24px;font-size:17px;color:#E6FFFA\">کارهای تکراری آماده‌سازی و اعمال کد را به CodeBridge بسپار؛ ذهنت برای معماری، کیفیت و تصمیم‌هایی آزاد می‌ماند که واقعاً به ارزش محصول اضافه می‌کنند.<\u002Fp>\n<div style=\"font-size:15px;color:#CCFBF1;margin-bottom:16px\">سیستم‌عامل خودت را انتخاب کن تا نسخه‌ی مناسب دانلود شود<\u002Fdiv>\n<div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap\">\n<a class=\"btn\" href=\"#dl\" style=\"background:#fff;color:#0B3F3A;min-height:52px;gap:10px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"8.5\" height=\"8.5\" rx=\"1\"><\u002Frect><rect x=\"12.5\" y=\"3\" width=\"8.5\" height=\"8.5\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"12.5\" width=\"8.5\" height=\"8.5\" rx=\"1\"><\u002Frect><rect x=\"12.5\" y=\"12.5\" width=\"8.5\" height=\"8.5\" rx=\"1\"><\u002Frect><\u002Fsvg>دانلود برای ویندوز<\u002Fa>\n<a class=\"btn\" href=\"#dl\" style=\"background:#fff;color:#0B3F3A;min-height:52px;gap:10px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M8 20h8M12 16v4\"><\u002Fpath><\u002Fsvg>دانلود برای مک (macOS)<\u002Fa>\n<a class=\"btn\" href=\"#dl\" style=\"background:#fff;color:#0B3F3A;min-height:52px;gap:10px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M7 10l3 2-3 2M13 15h4\"><\u002Fpath><\u002Fsvg>دانلود برای لینوکس<\u002Fa>\n<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:14px;color:#CCFBF1\">اپ دسکتاپ برای اعمال diff و Undo است. فقط خروجی می‌خواهی؟ <a href=\"#mobile\" style=\"text-decoration:underline;color:#fff\">نسخه‌ی مرورگر را روی گوشی یا دسکتاپ امتحان کن<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 0 40px;text-align:center;color:#A3AFBF;font-size:14px\">CodeBridge · ابزار رایگان و متن‌باز برای کار با هوش مصنوعی<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2DD4BF&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:2350}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#2DD4BF' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
