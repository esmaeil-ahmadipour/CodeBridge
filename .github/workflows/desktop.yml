name: Desktop
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "CHANGELOG.md", "package.json", "scripts/**", "tests/**", ".github/workflows/desktop.yml", ".github/workflows/metadata-check.yml"]
  pull_request:
    paths: ["apps/desktop/**", "CHANGELOG.md", "package.json", "scripts/**", "tests/**", ".github/workflows/desktop.yml", ".github/workflows/metadata-check.yml"]

defaults:
  run:
    working-directory: apps/desktop

jobs:
  metadata:
    uses: ./.github/workflows/metadata-check.yml
    permissions:
      contents: read

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email "ci@example.com" && git config --global user.name "ci"
      - run: python -m unittest discover -s tests -v
