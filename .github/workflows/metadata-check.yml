name: Shared release metadata

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync generated desktop version
        run: python scripts/sync_version.py
      - name: Check shared release metadata
        run: python -m unittest discover -s tests -v
