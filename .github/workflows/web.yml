name: Web
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "apps/desktop/pyproject.toml", "apps/desktop/src/codebridge/__init__.py", "CHANGELOG.md", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "scripts/**", "tests/**", ".github/workflows/web.yml", ".github/workflows/metadata-check.yml"]
  pull_request:
    paths: ["apps/web/**", "apps/desktop/pyproject.toml", "apps/desktop/src/codebridge/__init__.py", "CHANGELOG.md", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "scripts/**", "tests/**", ".github/workflows/web.yml", ".github/workflows/metadata-check.yml"]

defaults:
  run:
    working-directory: apps/web

jobs:
  metadata:
    uses: ./.github/workflows/metadata-check.yml
    permissions:
      contents: read

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@12.16.1 --activate
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
